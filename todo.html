<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="todo-app">

            <h2>To-Do-List</h2>

            <div class="row">
                <input type="text" id="tarefa" placeholder="Adicione uma tarefa">
                <button onclick="add_tarefa()">Adicionar</button>
            </div>

            <ul id="listaTarefas"></ul>

            <p id="qtd_tarefas">
                quantidade de tarefas: 0
            </p>
            <p id="qtd_concluidas">Concluídas: 0</p>
            <p id="qtd_pendentes">Pendentes: 0</p>
        </div>

    </div>

    <script src="script1.js"></script>

</body>
</html>
